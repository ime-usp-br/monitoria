# ---------------------------------------------------------------------------
# Monitoria — docker-compose único (Laravel / PHP 7.4)
#
# Os serviços se comunicam na rede bridge default do projeto. O serviço `nginx`
# também ingressa numa rede externa (`web`, reverse proxy) para exposição via
# domínio/TLS — por isso não publica porta de host. A rede externa deve existir:
#   docker network create web
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: monitoria
        uid: 1000
    container_name: monitoria-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    entrypoint: ["sh", "./docker/entrypoint.sh"]
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: monitoria-nginx
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - default
      - web
    depends_on:
      - app

  mysql:
    image: mysql:5.7
    container_name: monitoria-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: monitoria-redis
    restart: unless-stopped

  # Queue worker — runs as www-data to avoid permission conflicts with Laravel storage/cache
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: monitoria
        uid: 1000
    container_name: monitoria-worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    entrypoint: ["sh", "./docker/worker-entrypoint.sh"]
    depends_on:
      - mysql
      - redis

networks:
  web:
    external: true

volumes:
  mysql-data:

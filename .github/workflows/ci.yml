name: CI

on:
  push:
    branches:
      - main
      - 'homolog/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHPUnit, auditorias e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar matriz E2E
        run: bash ./scripts/validate_e2e_coverage.sh

      - name: Preparar .env de CI
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=mysql/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=laravel_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=laravel/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=redis/' .env

      - name: Criar rede externa do compose
        run: docker network create web 2>/dev/null || true

      - name: Subir MySQL e Redis
        run: |
          docker compose up -d mysql redis
          for i in $(seq 1 60); do
            if docker compose exec -T mysql mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL não ficou pronto" >&2
          docker compose logs mysql
          exit 1

      - name: Build da imagem da aplicação
        run: docker compose build app

      - name: Instalar dependências, migrar o banco e rodar PHPUnit com cobertura
        run: |
          docker compose run --rm --no-deps --entrypoint sh app -lc '
            git config --global --add safe.directory /var/www &&
            apt-get update -qq &&
            apt-get install -y -qq $PHPIZE_DEPS >/dev/null &&
            pecl install pcov >/dev/null &&
            docker-php-ext-enable pcov &&
            composer install --no-interaction --prefer-dist --no-progress &&
            php artisan key:generate --force &&
            php artisan migrate --force &&
            mkdir -p build/logs &&
            php -d pcov.enabled=1 -d pcov.directory=app vendor/bin/phpunit \
              --colors=never --coverage-text --coverage-clover build/logs/clover.xml
          '

      - name: Publicar cobertura PHP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-phpunit
          path: build/logs/clover.xml
          if-no-files-found: ignore

      - name: Composer audit
        run: |
          docker compose run --rm --no-deps --entrypoint sh app -lc '
            git config --global --add safe.directory /var/www &&
            composer audit --locked
          '

      - name: npm ci + npm audit
        run: |
          docker run --rm -v "$PWD":/app -w /app node:22-alpine sh -c '
            npm ci --no-audit --no-fund &&
            npm audit
          '

      - name: Corrigir permissões do workspace
        run: |
          sudo chown -R "$(id -u):$(id -g)" storage bootstrap/cache public/vendor 2>/dev/null || true

      - name: E2E Playwright
        run: bash ./scripts/run_e2e.sh

      - name: Guardar artefatos do E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts
          if-no-files-found: ignore

  security:
    name: Segredos e vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (histórico completo)
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --verbose --redact --exit-code 1

      - name: Trivy (dependências, critical/high)
        run: |
          docker run --rm -v "$PWD":/repo aquasec/trivy:0.57.1 \
            fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 \
            --ignore-unfixed --skip-dirs vendor --skip-dirs node_modules \
            --skip-dirs tmp --skip-dirs .git --skip-dirs .kilo /repo

      - name: Build da imagem para scan
        run: docker build -t monitoria-app:scan .

      - name: Trivy (imagem OS, critical/high)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --pkg-types os --severity CRITICAL,HIGH --exit-code 1 \
            --ignore-unfixed monitoria-app:scan

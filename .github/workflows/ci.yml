name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'homolog/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Contrato, PHPUnit, auditorias e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar contrato de deploy
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config -q
          docker compose -f docker-compose.test.yml config -q
          bash ./scripts/check-deploy-contract.sh

      - name: Validar matriz E2E
        run: bash ./scripts/validate_e2e_coverage.sh

      - name: Build da imagem de teste
        run: docker compose -f docker-compose.test.yml build test

      - name: PHPUnit (stack isolada)
        run: docker compose -f docker-compose.test.yml run --rm test

      - name: Composer audit
        run: |
          docker run --rm -v "$PWD":/app -w /app \
            composer:2@sha256:50ea4d33fdcde1adb0f045547295faa1548b33872e5f789dae5b02ce2fb5de93 \
            audit --locked

      - name: Verificar assets externos
        run: bash ./scripts/check_external_assets.sh

      - name: npm ci + npm audit
        run: |
          docker run --rm -v "$PWD":/app -w /app node:22-alpine sh -c '
            npm ci --no-audit --no-fund &&
            npm audit
          '

      - name: Corrigir permissões do workspace
        run: |
          sudo chown -R "$(id -u):$(id -g)" storage bootstrap/cache public/vendor 2>/dev/null || true

      - name: E2E Playwright
        run: bash ./scripts/run_e2e.sh

      - name: Guardar artefatos do E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts
          if-no-files-found: ignore

  security:
    name: Segredos e vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (histórico completo)
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --verbose --redact --exit-code 1

      - name: Trivy (dependências, critical/high)
        run: |
          docker run --rm -v "$PWD":/repo aquasec/trivy:0.57.1 \
            fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 \
            --ignore-unfixed --skip-dirs vendor --skip-dirs node_modules \
            --skip-dirs tmp --skip-dirs .git --skip-dirs .kilo /repo

      - name: Build da imagem para scan
        run: docker build --target runtime -t monitoria-app:scan .

      - name: Trivy (imagem OS, critical/high)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --pkg-types os --severity CRITICAL,HIGH --exit-code 1 \
            --ignore-unfixed monitoria-app:scan

; Runtime PHP da aplicação (imagem de deploy).
; Os valores de ambiente chegam pelo Portainer e são repassados ao PHP-FPM
; (a imagem oficial já define clear_env = no no pool www).

upload_max_filesize = 4M
post_max_size = 4M
memory_limit = 256M
max_execution_time = 300
expose_php = Off

date.timezone = America/Sao_Paulo

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers --output=/e2e-artifacts/playwright --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure
timeout = 120
markers =
    p0: jornada critica do ciclo anual
    p1: modulos complementares
    p2: casos de borda e permissoes
    mail: depende do Mailpit
    pdf: gera ou valida PDF
    replicado: depende do Sybase falso
    queue: exige worker/profile async
    kernel: executa schedule:run
    slow: execucao longa

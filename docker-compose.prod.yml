services:
  app:
    environment:
      ALLOW_DEV_ENV: "false"
    volumes: !override
      - .:/var/www:ro
      - monitoria-storage:/var/www/storage
      - monitoria-cache:/var/www/bootstrap/cache
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro

  nginx:
    volumes: !override
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    environment:
      ALLOW_DEV_ENV: "false"
    volumes: !override
      - .:/var/www:ro
      - monitoria-storage:/var/www/storage
      - monitoria-cache:/var/www/bootstrap/cache
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
